name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python scripts/check_site.py
      - run: python -m pip install opencv-python-headless==4.13.0.92 numpy==2.5.4
      - run: python scripts/test_area_article.py
      - run: python scripts/validate_html.py insights/opencv-pixelflaeche-konturflaeche-python.html en/insights/opencv-pixel-area-contour-area-python.html
      - run: git diff --check
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: tmp/browser-results
          retention-days: 14
