# Redirects from the old Squarespace URLs to the new static site paths.
# Netlify serves *.html files at their extensionless path automatically
# ("Pretty URLs"), so most old paths (/uebermich, /consulting, /nachhilfe,
# /kontakt, /impressum, /datenschutz, /agb, /insights, /insights/effektive-nachhilfe)
# already match without any redirect. Only the slugs that changed need one.

[[redirects]]
  from = "https://www.sarahofmann.de/*"
  to = "https://sarahofmann.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/dozententtigkeit"
  to = "/dozententaetigkeit"
  status = 301

[[redirects]]
  from = "/insights/3d-druck-in-der-robotik-praktische-anwendungen-im-alltag"
  to = "/insights/3d-druck-in-der-robotik"
  status = 301

[[redirects]]
  from = "/insights/warum-interdisziplinres-denken-die-zukunft-der-technik-ist"
  to = "/insights/interdisziplinaeres-denken"
  status = 301

[[redirects]]
  from = "/insights/beruf-amp-studium-wie-ich-balance-finde"
  to = "/insights/beruf-studium-balance"
  status = 301

[[redirects]]
  from = "/insights/matlabsimulink"
  to = "/insights/matlab-simulink"
  status = 301

[[redirects]]
  from = "/s/CV_SaraHofmann.pdf"
  to = "/assets/cv/CV_SaraHofmann.pdf"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; media-src 'self'; manifest-src 'self'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
